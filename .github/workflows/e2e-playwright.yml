name: Playwright E2E Nightly & Manual Tests

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug_trace:
        description: 'Record Playwright debugging trace'
        required: false
        default: 'false'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 for Backend Stack
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js for Frontend & Playwright
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend/lmdb
        run: npm ci

      - name: Install Playwright & Browser Dependencies
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start Infrastructure (Backend & Frontend)
        env:
          TMDB_API_KEY: "dummy_key_for_e2e_tests"
          JWT_SECRET: "dummy_jwt_secret_for_e2e_tests"
        run: |
          ./infrastructure/scripts/start-infrastructure.sh
          
          echo "Waiting for API Gateway to be healthy..."
          timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)" != "200" ]]; do sleep 5; done' || (echo "API Gateway failed" && docker compose -f infrastructure/docker/docker-compose.yml logs && exit 1)
          
          echo "Waiting for Frontend to be healthy..."
          timeout 120 bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)" != "200" && "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)" != "304" && "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)" != "404" ]]; do sleep 5; done' || (echo "Frontend failed" && exit 1)

      - name: Execute Playwright E2E Test Suite
        working-directory: e2e
        env:
          FRONTEND_URL: http://localhost:3000
          BACKEND_API_URL: http://localhost:8080
        run: npm test
