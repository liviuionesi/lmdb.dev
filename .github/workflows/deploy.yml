name: Deploy

# Smart Cloud Deploy Workflow (ARCHITECTURE.md §11.4 / issue #160).
# Features:
# 1. Protected by mandatory passphrase authorization against secrets.DEPLOY_PASSPHRASE.
# 2. Self-healing / Smart lifecycle:
#    - If cluster is Stopped (e.g. from 1-hour auto-stop), automatically starts it.
#    - If cluster was Destroyed (no Terraform state), automatically provisions it.
# 3. Rolls out all 9 microservices and database statefulsets.
# 4. Updates DuckDNS automatically.
# 5. Tracks deployment status in GitHub Environments (azure-cloud / aws-cloud).

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud target to deploy to"
        required: true
        type: choice
        options:
          - azure
          - aws
      passphrase:
        description: "Deployment Authorization Passphrase"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  deploy-azure:
    if: github.event.inputs.cloud == 'azure'
    name: Deploy (azure)
    runs-on: ubuntu-latest
    environment:
      name: azure-cloud
      url: https://filmpire-api.duckdns.org
    defaults:
      run:
        working-directory: infrastructure/terraform/azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Validate Deployment Passphrase
        env:
          INPUT_PASSPHRASE: ${{ github.event.inputs.passphrase }}
          SECRET_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE }}
        run: |
          if [ -z "$SECRET_PASSPHRASE" ]; then
            echo "::error::❌ Repository secret DEPLOY_PASSPHRASE is not configured in GitHub Secrets. Action blocked."
            exit 1
          fi
          if [ -z "$INPUT_PASSPHRASE" ] || [ "$INPUT_PASSPHRASE" != "$SECRET_PASSPHRASE" ]; then
            echo "::error::❌ Invalid deployment authorization passphrase provided. Deployment aborted."
            exit 1
          fi
          echo "✅ Passphrase validated successfully."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"

      - name: Smart Infra Check (Auto-Wake or Auto-Provision)
        id: infra
        run: |
          RG=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo "")

          if [ -z "$RG" ] || [ -z "$CLUSTER" ]; then
            echo "🚀 Infra not found in Terraform state. Auto-provisioning AKS with Terraform..."
            terraform apply -auto-approve -input=false \
              -var="alert_emails=[\"${{ vars.ALERT_EMAIL }}\"]" \
              -var="budget_start_date=$(date -u +%Y-%m-01T00:00:00Z)"
            RG=$(terraform output -raw resource_group_name)
            CLUSTER=$(terraform output -raw cluster_name)
          else
            echo "🔍 Checking cluster power state for $CLUSTER in $RG..."
            STATE=$(az aks show --resource-group "$RG" --name "$CLUSTER" --query "powerState.code" -o tsv 2>/dev/null || echo "NotFound")
            echo "  Current Power State: $STATE"

            if [ "$STATE" == "Stopped" ]; then
              echo "⚡ Cluster is Stopped. Waking up AKS cluster..."
              az aks start --resource-group "$RG" --name "$CLUSTER"
            elif [ "$STATE" == "NotFound" ]; then
              echo "🚀 Cluster resource not found in Azure. Re-provisioning..."
              terraform apply -auto-approve -input=false \
                -var="alert_emails=[\"${{ vars.ALERT_EMAIL }}\"]" \
                -var="budget_start_date=$(date -u +%Y-%m-01T00:00:00Z)"
              RG=$(terraform output -raw resource_group_name)
              CLUSTER=$(terraform output -raw cluster_name)
            fi
          fi

          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$CLUSTER" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.infra.outputs.resource_group }}" \
            --name "${{ steps.infra.outputs.cluster_name }}" \
            --overwrite-existing

      - name: kubectl apply -k overlays/azure
        run: kubectl apply -k ../../kubernetes/overlays/azure

      - name: Wait for full workload rollout (9 services)
        run: |
          echo "⏳ Verifying application deployments..."
          kubectl rollout status deployment/api-gateway --timeout=180s
          kubectl rollout status deployment/movie-service --timeout=180s
          kubectl rollout status deployment/actor-service --timeout=180s
          kubectl rollout status deployment/user-service --timeout=180s
          kubectl rollout status deployment/ai-service --timeout=180s
          echo "⏳ Verifying database statefulsets..."
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl rollout status statefulset/mongodb --timeout=180s
          kubectl rollout status statefulset/redis --timeout=180s
          kubectl rollout status statefulset/ollama --timeout=180s

      - name: Update Dynamic DNS
        env:
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}' || true)
          if [ -n "$NODE_IP" ] && [ -n "$DUCKDNS_TOKEN" ]; then
            ../../scripts/update-duckdns.sh "$NODE_IP"
            echo "✅ DuckDNS updated → $NODE_IP"
          else
            echo "ℹ️ DuckDNS update skipped (missing IP or DUCKDNS_TOKEN)"
          fi

  deploy-aws:
    if: github.event.inputs.cloud == 'aws'
    name: Deploy (aws)
    runs-on: ubuntu-latest
    environment:
      name: aws-cloud
      url: https://filmpire-api.duckdns.org
    defaults:
      run:
        working-directory: infrastructure/terraform/aws
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Validate Deployment Passphrase
        env:
          INPUT_PASSPHRASE: ${{ github.event.inputs.passphrase }}
          SECRET_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE }}
        run: |
          if [ -z "$SECRET_PASSPHRASE" ]; then
            echo "::error::❌ Repository secret DEPLOY_PASSPHRASE is not configured in GitHub Secrets. Action blocked."
            exit 1
          fi
          if [ -z "$INPUT_PASSPHRASE" ] || [ "$INPUT_PASSPHRASE" != "$SECRET_PASSPHRASE" ]; then
            echo "::error::❌ Invalid deployment authorization passphrase provided. Deployment aborted."
            exit 1
          fi
          echo "✅ Passphrase validated successfully."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_TABLE }}"

      - name: Smart Infra Check (Auto-Wake or Auto-Provision)
        id: infra
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id 2>/dev/null || echo "")
          PUBLIC_IP=$(terraform output -raw public_ip 2>/dev/null || echo "")

          if [ -z "$INSTANCE_ID" ]; then
            echo "🚀 AWS infra not found in state. Auto-provisioning..."
            terraform apply -auto-approve -input=false \
              -var="alert_emails=[\"${{ vars.ALERT_EMAIL }}\"]" \
              -var="ssh_public_key=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGhub2RldGVzdGtleWVwaGVtZXJhbGRlbW8K dummy"
            INSTANCE_ID=$(terraform output -raw instance_id)
            PUBLIC_IP=$(terraform output -raw public_ip)
          else
            STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" -o text 2>/dev/null || echo "not-found")
            echo "  Current EC2 State: $STATE"

            if [ "$STATE" == "stopped" ]; then
              echo "⚡ Resuming stopped AWS EC2 instance..."
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].PublicIpAddress" -o text)
            elif [ "$STATE" == "not-found" ] || [ "$STATE" == "terminated" ]; then
              echo "🚀 Re-provisioning AWS infra..."
              terraform apply -auto-approve -input=false \
                -var="alert_emails=[\"${{ vars.ALERT_EMAIL }}\"]" \
                -var="ssh_public_key=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGhub2RldGVzdGtleWVwaGVtZXJhbGRlbW8K dummy"
              INSTANCE_ID=$(terraform output -raw instance_id)
              PUBLIC_IP=$(terraform output -raw public_ip)
            fi
          fi

          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "ssh_user=$(terraform output -raw ssh_user 2>/dev/null || echo 'ubuntu')" >> "$GITHUB_OUTPUT"

      - name: Fetch kubeconfig over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/k3s_deploy_key
          chmod 600 ~/.ssh/k3s_deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/k3s_deploy_key \
            "${{ steps.infra.outputs.ssh_user }}@${{ steps.infra.outputs.public_ip }}" \
            sudo cat /etc/rancher/k3s/k3s.yaml > "$RUNNER_TEMP/kubeconfig-aws.yaml"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig-aws.yaml" >> "$GITHUB_ENV"

      - name: kubectl apply -k overlays/aws
        run: kubectl apply -k ../../kubernetes/overlays/aws

      - name: Wait for full workload rollout (9 services)
        run: |
          echo "⏳ Verifying application deployments..."
          kubectl rollout status deployment/api-gateway --timeout=180s
          kubectl rollout status deployment/movie-service --timeout=180s
          kubectl rollout status deployment/actor-service --timeout=180s
          kubectl rollout status deployment/user-service --timeout=180s
          kubectl rollout status deployment/ai-service --timeout=180s
          echo "⏳ Verifying database statefulsets..."
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl rollout status statefulset/mongodb --timeout=180s
          kubectl rollout status statefulset/redis --timeout=180s
          kubectl rollout status statefulset/ollama --timeout=180s

      - name: Update Dynamic DNS
        env:
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          if [ -n "${{ steps.infra.outputs.public_ip }}" ] && [ -n "$DUCKDNS_TOKEN" ]; then
            ../../scripts/update-duckdns.sh "${{ steps.infra.outputs.public_ip }}"
          fi
