name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # secrets.* can't be referenced directly in a step `if:` (GitHub Actions
    # rejects it — "Unrecognized named-value: 'secrets'"). Job-level `env:`
    # *can* read secrets, so resolve the presence check here once and have
    # the SonarQube step's `if:` read the env var instead (#108).
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all services
        # Also runs `check`, which now includes spotlessCheck (#101) —
        # formatting violations fail the build here, no separate step needed.
        run: ./gradlew clean build -x test
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      
      - name: Run tests
        run: ./gradlew test
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      
      - name: Generate test coverage report
        run: ./gradlew jacocoTestReport
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Verify coverage threshold (#108)
        # 80% minimum line coverage per module (root build.gradle's shared
        # jacocoTestCoverageVerification config) — media-service is exempt
        # there until #94 replaces its placeholder controller with real code.
        run: ./gradlew jacocoTestCoverageVerification
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: SonarQube analysis (#108)
        # Runs only once a SONAR_TOKEN secret is configured. This repo is
        # public, so SonarCloud's free tier applies — no self-hosted server
        # or paid plan needed, matching ADR-004's $0 budget. Until that
        # secret is added, this step is skipped rather than failing the
        # build on a missing credential, mirroring the NVD_API_KEY
        # non-blocking pattern below: an unconfigured *optional* external
        # integration shouldn't block CI.
        #
        # Also restricted to pushes on `main`: verified against the live
        # SonarCloud API (#108) that the free/Community org plan only
        # stores analysis for the default branch — a `develop` push still
        # reports BUILD SUCCESSFUL locally, but SonarCloud silently
        # discards it server-side (no `develop` branch component is ever
        # created). Running it there would burn CI time for a result that
        # never lands anywhere. `main` only moves at Sprint-end merges, so
        # this still analyzes every real Increment.
        if: ${{ env.HAS_SONAR_TOKEN == 'true' && github.ref == 'refs/heads/main' }}
        run: ./gradlew sonar
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

      - name: Compute cache week
        id: dc-week
        # %G/%V (ISO week-based year/week), not %Y/%V — late-December ISO
        # week 1 can belong to the next Gregorian year, which would
        # otherwise mislabel the cache key right at the year boundary.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP Dependency-Check NVD database cache
        id: dc-cache
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          # v2 (#109): bumped from the old unversioned key to bust a
          # corrupted cache entry. The previous combined actions/cache@v4
          # step saved unconditionally at job end, including when this
          # step below had just been SIGKILL'd mid-write by the `timeout`
          # call — that persisted a half-written, corrupt H2 database into
          # the cache, and every later run restored + instantly crashed on
          # it (MVStoreException/ClosedChannelException), a *second*
          # permanent failure loop distinct from the original timeout one.
          # Save is now gated on success below, so this shouldn't recur —
          # the v2 bump only clears the one bad entry already saved.
          key: dependency-check-nvd-v2-${{ steps.dc-week.outputs.week }}
          restore-keys: dependency-check-nvd-v2-

      - name: Dependency/security scan (#101)
        # No NVD_API_KEY secret is configured yet — without one, a
        # cache-miss NVD sync routinely exceeds 20 minutes (confirmed on
        # develop: 5 straight CI runs timed out here, and since the step
        # never finished, its cache never saved either, so every run paid
        # the same cold-sync cost — a permanent failure loop, #109).
        #
        # A *timeout with no key configured* is treated as non-blocking —
        # a known, already-documented limitation, not a real finding — but
        # the forced kill can leave a partially-written NVD cache behind,
        # so that branch always wipes .dependency-check-data before
        # exiting rather than let a corrupt directory reach the save step.
        #
        # A crash matching dependency-check's own DB-corruption signature
        # (distinct from a real CVE finding, which fails via
        # build.gradle's failBuildOnCVSS through a normal Gradle
        # BUILD FAILED, not these low-level H2/NIO exceptions) is treated
        # as a corrupted-cache problem: wipe and retry once. A second
        # failure of any kind still fails the step for real — this can't
        # mask a genuine security failure, only recover from a bad cache.
        timeout-minutes: 45
        run: |
          set +e
          attempt=1
          max_attempts=2
          while [ "$attempt" -le "$max_attempts" ]; do
            timeout --kill-after=10s 1200 ./gradlew dependencyCheckAggregate 2>&1 | tee dependency-check.log
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 124 ] && [ -z "$NVD_API_KEY" ]; then
              echo "::warning::dependency-check timed out after 20m with no NVD_API_KEY configured (#109) — known limitation, treated as non-blocking. A real CVE finding, or a timeout once the key is set, still fails this step."
              rm -rf .dependency-check-data
              status=0
              break
            fi

            if [ "$status" -ne 0 ] && [ "$attempt" -lt "$max_attempts" ] && grep -qE "MVStoreException|ClosedChannelException" dependency-check.log; then
              echo "::warning::dependency-check crashed reading a corrupted local NVD cache (#109) — wiping the cache and retrying once."
              rm -rf .dependency-check-data
              attempt=$((attempt + 1))
              continue
            fi

            break
          done
          set -e
          exit "$status"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save OWASP Dependency-Check NVD database cache
        # Only cache a scan that actually completed cleanly — never a
        # killed/wiped or corrupted run (#109). If the scan above wiped
        # .dependency-check-data, this step just finds nothing to save.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: ${{ steps.dc-cache.outputs.cache-primary-key }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

      - name: Upload dependency-check raw log
        # Only exists on failure paths above — helps diagnose a future
        # corruption-retry or a real CVE failure without re-running CI.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-log
          path: dependency-check.log
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            backend/*/build/test-results/test/**/*.xml
            backend/*/build/reports/tests/test/
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: backend/*/build/reports/jacoco/test/

