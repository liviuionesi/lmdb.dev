name: Docker Publish

# Chained after Backend CI succeeds on main (ARCHITECTURE.md §11.4):
# push to main -> backend-ci.yml -> docker-publish.yml -> deploy.yml (manual).
# workflow_run (not push) so a failing build/test never produces an image —
# every image is built from a commit CI has already verified green.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - discovery-service
          - config-service
          - movie-service
          - user-service
          - actor-service
          - ai-service
          - media-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repo root, not backend/<service>/: every
      # service Dockerfile does `COPY backend backend` plus root-level
      # gradlew/gradle.properties/build.gradle/settings.gradle, since the
      # multi-module Gradle build needs all modules present to build one
      # service's bootJar.
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/liviuionesi/lmdb-${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/liviuionesi/lmdb-${{ matrix.service }}:latest
