name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '!docs/**'
      - '!**.md'
  # Only Dependabot pull requests run the job below; they get no other check.
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lmdb:
    name: LMDB React app
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/lmdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/lmdb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Dependency/security scan (#105, #131)
        run: npm audit --audit-level=moderate

      # 80% line-coverage gate (#110) — same enterprise target as the
      # backend's JaCoCo rule (#108). Config lives in vite.config.mjs's
      # `test.coverage` block (#131): exclude deliberately covers
      # src/index.jsx, src/app/store.js, src/assets/**,
      # src/components/index.js, src/components/styles.js, and
      # src/components/App.jsx — bootstrap wiring, static asset data, and a
      # barrel re-export file with no branch logic worth gating on,
      # mirroring the backend's config/DTO exclusions. `vitest run
      # --coverage` fails the build below threshold; `vitest run` is
      # already non-watch by default, so no CRA-style --watchAll flag.
      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          CI: true
