name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  filmpire:
    name: Filmpire React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/filmpire

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/filmpire/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Dependency/security scan (#101)
        # Critical-only for now — 30 pre-existing high/moderate/low findings
        # are transitive react-scripts/webpack-dev-server dev-tooling
        # vulnerabilities with no non-breaking fix available (see #101).
        # Tightening this threshold is a deliberate follow-up, not a
        # silent ratchet-down.
        run: npm audit --audit-level=critical

      - name: Build application
        run: npm run build
        env:
          CI: true

  web-nextjs:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web-nextjs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Check if frontend implemented
        id: check-impl
        run: |
          if [ -f "package-lock.json" ]; then
            echo "implemented=true" >> $GITHUB_OUTPUT
          else
            echo "implemented=false" >> $GITHUB_OUTPUT
            echo "⚠️  Frontend not implemented yet - skipping build"
          fi
      
      - name: Install dependencies
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm ci
      
      - name: Run linter
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm run lint
      
      - name: Run type check
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm run type-check || echo "Type check not configured"
        continue-on-error: true
      
      - name: Run tests
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm test || echo "Tests not configured"
        continue-on-error: true
      
      - name: Build application
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      
      - name: Upload build artifacts
        if: steps.check-impl.outputs.implemented == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: frontend/web-nextjs/.next/

  mobile-react-native:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile-react-native
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Check if frontend implemented
        id: check-impl
        run: |
          if [ -f "package-lock.json" ]; then
            echo "implemented=true" >> $GITHUB_OUTPUT
          else
            echo "implemented=false" >> $GITHUB_OUTPUT
            echo "⚠️  Frontend not implemented yet - skipping build"
          fi
      
      - name: Install dependencies
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm ci
      
      - name: Run linter
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm run lint || echo "Lint not configured"
        continue-on-error: true
      
      - name: Run type check
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm run type-check || echo "Type check not configured"
        continue-on-error: true
      
      - name: Run tests
        if: steps.check-impl.outputs.implemented == 'true'
        run: npm test || echo "Tests not configured"
        continue-on-error: true
