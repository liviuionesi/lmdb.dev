name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  filmpire:
    name: Filmpire React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/filmpire

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/filmpire/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Dependency/security scan (#105)
        run: npm audit --audit-level=high

      # 80% line-coverage gate (#110) — same enterprise target as the
      # backend's JaCoCo rule (#108). Config lives in package.json's "jest"
      # key: collectCoverageFrom deliberately excludes src/index.js,
      # src/app/store.js, src/assets/**, src/components/index.js,
      # src/components/styles.js, and src/components/App.jsx — bootstrap
      # wiring, static asset data, and a barrel re-export file with no
      # branch logic worth gating on, mirroring the backend's config/DTO
      # exclusions. `react-scripts test` fails the build below threshold.
      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          CI: true
