# Java
javaVersion=25
projectVersion=1.0.0-SNAPSHOT

# Spring Boot  
springBootVersion=4.1.1
springDependencyManagementVersion=1.1.7

# Spring Cloud
springCloudVersion=2025.1.2
springCloudContractVersion=5.0.3

# Spring AI (2.x tracks Spring Boot 4.x; ai-service is the only consumer — #36)
springAiVersion=2.0.0

# gRPC codegen (ai-service.proto — #36)
protobufPluginVersion=0.9.6
protocVersion=4.29.3

# Dependencies
lombokVersion=1.18.46
lombokMapstructBindingVersion=0.2.0
mapstructVersion=1.6.3
jjwtVersion=0.13.0
# No grpcVersion here on purpose: Spring Boot's BOM imports io.grpc:grpc-bom, so
# ai-service takes every gRPC artifact (protoc-gen-grpc-java included) from the BOM
# rather than a pin that has to be remembered on each Boot upgrade. See
# backend/ai-service/build.gradle.
springdocVersion=3.1.0
minioVersion=8.5.7
# Local, $0 speech-to-text (#68) — offline Vosk model, no cloud STT provider.
voskVersion=0.3.45
# JSON structured logging for the ELK pipeline (#23). Not in the Spring Boot
# BOM, so the version is pinned here.
logstashEncoderVersion=8.1

# Testing
junitVersion=5.11.3
mockitoVersion=5.19.0
testcontainersVersion=2.0.5
jacocoVersion=0.8.14
wiremockVersion=3.9.1
gatlingVersion=3.13.3
bucket4jVersion=8.10.1
redisTestcontainersVersion=2.2.2
awaitilityVersion=4.3.0

# Security & CVE Version Overrides (ahead of Spring Boot BOM refresh)
tomcatVersion=11.0.24
nettyVersion=4.2.16.Final
jacksonBomVersion=2.21.5
postgresqlDriverVersion=42.7.13
log4j2Version=2.25.5
httpcore5Version=5.4.3
httpclientVersion=4.5.14
commonsCompressVersion=1.28.0

# Build tooling
openRewriteVersion=7.37.0
rewriteRecipeBomVersion=3.35.0
sonarqubePluginVersion=6.2.0.5505
# Formatting + dependency/security-scan gates (#101)
spotlessVersion=8.9.0
owaspDependencyCheckVersion=12.2.2

# Build
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false


