plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    // Generates Java stubs from src/main/proto/ai_service.proto (#36).
    id 'com.google.protobuf' version "${protobufPluginVersion}"
}

dependencies {
    implementation project(':backend:shared-library')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // RestClient calls to movie-service ("lb://movie-service" — #36's
    // recommendation candidates come from Filmpire's own catalog, not TMDB).
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.postgresql:postgresql'
    // hibernate-core's built-in vector JdbcTypes (SqlTypes.VECTOR et al.) are
    // a separate module — without it on the classpath Hibernate silently
    // falls back to serializing float[] as bytea instead of pgvector's
    // `vector` type, and every insert 500s. Version comes from Spring Boot's
    // BOM (same org.hibernate.orm group as hibernate-core).
    implementation 'org.hibernate.orm:hibernate-vector'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Ollama only (not the OpenAI starter) — ADR-004's $0 budget rules out a
    // paid model provider; ai-service runs entirely against a local model.
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // Offline speech-to-text (#68, replaces Alan AI) — Vosk runs entirely
    // in-process against a local model directory, no cloud STT provider.
    implementation "com.alphacephei:vosk:${voskVersion}"

    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

bootJar {
    archiveBaseName = 'ai-service'
    archiveVersion = project.version
}
