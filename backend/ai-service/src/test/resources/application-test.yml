# Test profile: no discovery infra by default (individual tests can opt back
# in via @SpringBootTest properties, e.g. AiServiceIntegrationTest's
# SimpleDiscoveryClient registration), no Redis (cache no-op); the PostgreSQL
# (pgvector) datasource comes from Testcontainers via @ServiceConnection.
# ChatModel/EmbeddingModel are replaced by @Primary Mockito mocks
# (AiModelTestConfig) rather than excluding Spring AI's autoconfiguration —
# no real Ollama server is reachable in CI.
spring:
  cloud:
    # No config server in tests; with the config client on the classpath
    # Spring Cloud otherwise demands a spring.config.import.
    config:
      enabled: false
    discovery:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: none

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Ephemeral (OS-assigned) port so the gRPC server never collides with
# another test run or a real local ai-service instance.
grpc:
  server:
    port: 0
