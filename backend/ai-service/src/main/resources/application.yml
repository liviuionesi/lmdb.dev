server:
  port: 8084
  forward-headers-strategy: framework

# gRPC server port (#36, ARCHITECTURE.md §3.7) — separate from the REST port
# above, started by GrpcServerLifecycle as its own Netty server.
grpc:
  server:
    port: 9084

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: ai-service
  datasource:
    # Database-per-service (ADR-002): ai-service owns filmpire_ai so its
    # Flyway history never collides with user/actor-service's in the shared
    # instance (which must run pgvector/pgvector:pg17 — ADR-012).
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/filmpire_ai}
    username: ${POSTGRES_USERNAME:admin}
    password: ${POSTGRES_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it —
      # the whole point of ADR-012 (conversations get the same protection
      # user-service already gives accounts/favorites).
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      # Derived/disposable artifacts only (scored candidate lists) — never
      # conversations or taste profiles, which are the persisted PostgreSQL
      # data ADR-012 exists to protect.
      time-to-live: 300000  # 5 minutes, matching the movie-service facade
  ai:
    # Ollama only — no OpenAI starter on the classpath. ADR-004's $0 budget
    # rules out a paid model provider; this runs entirely against a local
    # model server.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        # 768-dimensional — must match the `vector(768)` column in
        # V2__init_ai_schema.sql. Changing this model requires a new
        # migration to alter that column's dimension.
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Candidate pool for recommendations comes from movie-service's own catalog
# (Filmpire's persisted data), not TMDB directly — see MovieCatalogClient.
movie-service:
  base-url: ${MOVIE_SERVICE_BASE_URL:lb://movie-service}

# Offline speech-to-text (#68). Model is downloaded
# separately (scripts/download-vosk-model.sh) — not committed to git, like
# Ollama's own model weights. SpeechToTextService loads it lazily, so a
# missing model doesn't block ai-service's other features from starting.
speech-to-text:
  vosk:
    model-path: ${VOSK_MODEL_PATH:./models/vosk-model-small-en-us-0.15}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    # Without this, Eureka registers the instance by hostname; on a machine
    # where that hostname resolves to a non-routable/IPv6 address, the
    # gateway's lb:// route to ai-service hangs until connect-timeout.
    # movie-service/actor-service already set this — matching it here.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
