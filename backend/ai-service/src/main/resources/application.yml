server:
  port: 8084
  forward-headers-strategy: framework

# gRPC server port (#36, ARCHITECTURE.md §3.7) — separate from the REST port
# above, started by GrpcServerLifecycle as its own Netty server.
grpc:
  server:
    port: 9084
    # Shared service token every RPC must present as `x-service-token`
    # (GrpcAuthInterceptor). Nothing routes through api-gateway to reach this
    # port, so its JWT chain never applies here — this is the only thing
    # standing in front of the chat and recommendation logic on the gRPC side.
    # Unset means fail-closed: every call is rejected, rather than every call
    # being allowed.
    auth-token: ${AI_SERVICE_GRPC_TOKEN:}

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: ai-service
  http:
    clients:
      # Bounds the Ollama chat/embedding calls (#189) — Spring AI's own
      # OllamaApi is built from Boot's ambient, auto-configured
      # RestClient.Builder (confirmed against OllamaApiAutoConfiguration's
      # bytecode: it injects ObjectProvider<RestClient.Builder> and falls
      # onto whichever one Boot supplies), and that ambient builder is
      # exactly what these two properties configure — real, bound Boot 4.1
      # properties (HttpClientsProperties), unlike
      # spring.ai.ollama.chat.options.timeout below, which doesn't exist as
      # a property on OllamaChatProperties and was silently ignored.
      # MovieCatalogClient is unaffected: RestClientConfig deliberately
      # builds its RestClient outside this ambient builder (see its own
      # Javadoc) specifically so it isn't swept up in changes like this one.
      connect-timeout: 5s
      read-timeout: 60s
  servlet:
    multipart:
      # DispatcherServlet#checkMultipart runs before handler mapping, so with
      # the default eager resolution a MaxUploadSizeExceededException is
      # thrown while the resolved handler is still null — and
      # GlobalExceptionHandler's @RestControllerAdvice(basePackages = ...)
      # never matches a null handler type (#186/#187), so the oversized
      # /api/v1/ai/speech-to-text upload would fall through to Spring's
      # default ProblemDetail body instead of this service's ApiResponse
      # envelope. Lazy resolution defers parsing to argument binding inside
      # the already-resolved controller method, where the advice does apply.
      resolve-lazily: true
  datasource:
    # Database-per-service (ADR-002): ai-service owns lmdb_ai so its
    # Flyway history never collides with user/actor-service's in the shared
    # instance (which must run pgvector/pgvector:pg17 — ADR-012).
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it —
      # the whole point of ADR-012 (conversations get the same protection
      # user-service already gives accounts/favorites).
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      # Derived/disposable artifacts only (scored candidate lists) — never
      # conversations or taste profiles, which are the persisted PostgreSQL
      # data ADR-012 exists to protect.
      time-to-live: 300000  # 5 minutes, matching the movie-service facade
  ai:
    # Ollama only — no OpenAI starter on the classpath. ADR-004's $0 budget
    # rules out a paid model provider; this runs entirely against a local
    # model server.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        # 768-dimensional — must match the `vector(768)` column in
        # V2__init_ai_schema.sql. Changing this model requires a new
        # migration to alter that column's dimension.
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Candidate pool for recommendations comes from movie-service's own catalog
# (LMDB's persisted data), not TMDB directly — see MovieCatalogClient.
movie-service:
  base-url: ${MOVIE_SERVICE_BASE_URL:lb://movie-service}

# Offline speech-to-text (#68, bilingual per #200/#212). Models are downloaded
# separately (scripts/download-vosk-model.sh) — not committed to git, like
# Ollama's own model weights. SpeechToTextService loads each language lazily,
# so a missing model doesn't block ai-service's other features (or the other
# language) from starting. Model choice per ADR-021: English is
# vosk-model-en-us-0.22-lgraph (was vosk-model-small-en-us-0.15), German is
# vosk-model-small-de-0.15, ai-service's first German model.
speech-to-text:
  vosk:
    model-path: ${VOSK_MODEL_PATH:./models/vosk-model-en-us-0.22-lgraph}
    model-path-de: ${VOSK_MODEL_PATH_DE:./models/vosk-model-small-de-0.15}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    # Without this, Eureka registers the instance by hostname; on a machine
    # where that hostname resolves to a non-routable/IPv6 address, the
    # gateway's lb:// route to ai-service hangs until connect-timeout.
    # movie-service/actor-service already set this — matching it here.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    health:
      probes:
        enabled: true
  # Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

