syntax = "proto3";

package com.filmpire.ai;

option java_multiple_files = true;
option java_package = "com.filmpire.ai.grpc";
option java_outer_classname = "AiServiceProto";

// gRPC surface for ai-service (#36, ARCHITECTURE.md §3.7). Mirrors the two
// REST features implemented against Ollama: catalog-grounded recommendations
// and the conversational assistant. Voice transcription (Whisper) from the
// original architecture sketch is deliberately not implemented — it needs a
// paid OpenAI API key, which conflicts with ADR-004's $0 budget, and it is
// not part of issue #36's implementation checklist.
service AIService {
  rpc GetRecommendations(RecommendationRequest) returns (RecommendationResponse);
  rpc ChatWithAssistant(ChatRequest) returns (ChatResponse);
}

message RecommendationRequest {
  string user_id = 1;
  repeated string recent_movies = 2;
  int32 count = 3;
}

message RecommendationResponse {
  repeated MovieRecommendation recommendations = 1;
}

message MovieRecommendation {
  string movie_id = 1;
  double score = 2;
  string reason = 3;
}

message ChatRequest {
  string user_id = 1;
  string conversation_id = 2; // empty starts a new conversation
  string message = 3;
}

message ChatResponse {
  string conversation_id = 1;
  string reply = 2;
}
