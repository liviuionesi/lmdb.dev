# Movie Service Configuration
# This file is served by Spring Cloud Config Server

# Common settings for all profiles
tmdb:
  api:
    base-url: https://api.themoviedb.org/3

spring:
  cache:
    cache-names:
      - movies
      - movieLists
      - movieVideos
      - movieCredits
      - genres
    redis:
      time-to-live: 300000  # 5 minutes

feign:
  client:
    config:
      tmdb-client:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: BASIC

logging:
  level:
    dev.lmdb.movie: DEBUG

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  # Boot 4 renamed these two the opposite way round: Mongo lost its `data`
  # segment, Redis kept it. Keep both exactly as written.
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

tmdb:
  api:
    # TMDB API key passed via environment
    key: ${TMDB_API_KEY:}

logging:
  level:
    dev.lmdb.movie: DEBUG
    feign: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  mongodb:
    uri: ${MONGODB_URI:}  # Must be set via environment variable
  data:
    redis:
      host: ${REDIS_HOST:}  # Must be set via environment variable
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Must be set via environment variable

tmdb:
  api:
    key: ${TMDB_API_KEY:}  # Must be set via environment variable

logging:
  level:
    dev.lmdb.movie: INFO
    feign: INFO
