# Development environment configuration

logging:
  level:
    root: DEBUG
    '[dev.lmdb]': TRACE
    '[org.springframework.web]': DEBUG
    '[org.springframework.security]': DEBUG

# Common development database settings
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
  mongodb:
    auto-index-creation: true

# Common development actuator settings
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

