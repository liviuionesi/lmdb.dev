# Media Service specific configuration

spring:
  application:
    name: media-service
  mongodb:
    database: ${MONGODB_DATABASE:lmdb}
    uri: ${MONGODB_URI:mongodb://localhost:27017/lmdb}

# MinIO endpoint only. The access key and secret key stay in media-service's
# own application.yml: values served here take precedence over it, and a copy
# without the same fallbacks would break a run that relies on them.
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucket-name: ${MINIO_BUCKET:lmdb-media}

# Media service specific settings
media:
  upload:
    max-file-size: 10485760  # 10MB
    allowed-extensions: jpg,jpeg,png,gif,webp,mp4,webm
  storage:
    temp-dir: /tmp/lmdb-uploads

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

