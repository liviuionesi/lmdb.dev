# API Gateway specific configuration
#
# The route table is NOT here. It lives in the gateway's own application.yml,
# which is where it is maintained, and config-server values take precedence
# over a service's own file — so a copy here would silently replace the real
# routes with whatever this file happened to say.
#
# Keep this file to settings the config server is genuinely the source of
# truth for, and to values that are the same wherever the gateway runs.

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Gateway specific settings
gateway:
  rate-limit:
    enabled: true
    default-limit: 100
    refill-rate: 10

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
