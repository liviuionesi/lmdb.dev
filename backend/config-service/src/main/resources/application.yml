server:
  port: 8888

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        # Git mode disabled - using native/filesystem mode instead
        # git:
        #   uri: https://github.com/yourusername/lmdb-config-repo
        #   default-label: main
        #   clone-on-start: true

# Access control for the config endpoints (#244). Off by default so local
# development (no ${CONFIG_SECURITY_ENABLED} set) keeps working without
# credentials; a deployment turns it on by setting CONFIG_SECURITY_ENABLED=true
# plus CONFIG_SECURITY_PASSWORD. See ADR-022.
config:
  security:
    enabled: ${CONFIG_SECURITY_ENABLED:false}
    username: ${CONFIG_SECURITY_USERNAME:config}
  server:
    # Every {application} this server actually has a file for (see
    # src/main/resources/config/). A request for anything else 404s instead
    # of silently answering with just the common application.yml values.
    known-applications: application,movie-service,user-service,actor-service,media-service,ai-service,api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    health:
      probes:
        enabled: true
  # Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

