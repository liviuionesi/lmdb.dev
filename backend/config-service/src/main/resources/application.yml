server:
  port: 8888

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        # Git mode disabled - using native/filesystem mode instead
        # git:
        #   uri: https://github.com/yourusername/filmpire-config-repo
        #   default-label: main
        #   clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    health:
      probes:
        enabled: true
  # Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

