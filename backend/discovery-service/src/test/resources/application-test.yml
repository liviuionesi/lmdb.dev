server:
  port: 0

spring:
  application:
    name: discovery-service-test

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        # Mirrors the production exposure list — a narrower one here would let
        # the suite pass while the scrape endpoint is unreachable in the
        # deployed service, which is the drift #23 exists to catch.
        include: health,info,metrics,prometheus

logging:
  level:
    '[com.netflix.eureka]': WARN
    '[com.netflix.discovery]': WARN

