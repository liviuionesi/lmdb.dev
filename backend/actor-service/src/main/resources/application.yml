server:
  port: 8083
  # Honor X-Forwarded-* from the gateway so HATEOAS _links reflect the public
  # gateway host (localhost:8080) rather than the internal service host.
  forward-headers-strategy: framework

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: actor-service
  datasource:
    # Database-per-service (ADR-002): actor-service owns its own database so its
    # Flyway history never collides with user-service's in the shared instance.
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes, matching the movie-service facade

# TMDB API configuration (server-side key only — clients' api_key is ignored)
tmdb:
  api:
    key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3
    connect-timeout: ${TMDB_CONNECT_TIMEOUT:5000}
    read-timeout: ${TMDB_READ_TIMEOUT:10000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    # Without this, Eureka registers the instance by hostname; on a machine
    # where that hostname resolves to a non-routable/IPv6 address, the
    # gateway's lb:// route to actor-service hangs until connect-timeout.
    # movie-service already sets this — matching it here.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    health:
      probes:
        enabled: true
  # Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

