server:
  port: 8082

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: user-service
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    # Without this, Eureka registers the instance by hostname; on a machine
    # where that hostname resolves to a non-routable/IPv6 address, the
    # gateway's lb:// route to user-service hangs until connect-timeout.
    # movie-service already sets this — matching it here.
    prefer-ip-address: true

# JWT configuration.
# CONTRACT: jwt.secret MUST match the API gateway's jwt.secret — the gateway
# validates the access tokens this service issues (HS256, shared secret).
# The default below matches the gateway's default for local development;
# production MUST override via JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:3600000}          # access token: 1 hour
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # refresh: 7 days

# ADMIN bootstrap (#238). All three are unset by default, and
# AdminBootstrapService requires all three to be present before it creates
# anything — an unconfigured deployment ends up with no admin account
# rather than a default/guessable one. See
# docs/security/DDOS_PROTECTION_IMPLEMENTED.md for the operational
# procedure.
admin:
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    health:
      probes:
        enabled: true
  # Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Config Server is part of the docker-compose / bare-JVM profile only; the
# Kubernetes overlays set spring.cloud.config.enabled=false and supply the
# same values through ConfigMaps and Secrets instead (ADR-005).
# `optional:` keeps startup working when no config server is reachable.
# Excluded from the test profile so the suite never reaches for the network.
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
