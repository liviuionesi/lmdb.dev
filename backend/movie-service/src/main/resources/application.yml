server:
  port: 8081
  # Honor X-Forwarded-* from the gateway so HATEOAS _links reflect the public
  # gateway host (localhost:8080) rather than the internal service host.
  forward-headers-strategy: framework

spring:
  main:
    # The banner prints before logback initialises, so it is the only
    # non-JSON thing on stdout and would reach Filebeat as junk (#23).
    banner-mode: "off"
  application:
    name: movie-service

  # MongoDB Configuration
  mongodb:
    database: lmdb
    uri: ${MONGODB_URI:mongodb://localhost:27017/lmdb}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Redis Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes (300,000 ms)

  # Kafka Event Bus Configuration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[max.block.ms]": 2000
    consumer:
      group-id: movie-service-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Feign Client Configuration
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: BASIC
      compression:
        request:
          enabled: true
          mime-types: application/json
        response:
          enabled: true

# TMDB API Configuration
tmdb:
  api:
    key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    metadata-map:
      zone: primary
      version: 1.0.0

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    redis:
      enabled: true
    mongodb:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  # Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Logging Configuration
logging:
  level:
    root: INFO
    "[dev.lmdb.movie]": DEBUG
    "[org.springframework.web]": INFO
    "[org.springframework.data.mongodb]": DEBUG
    "[org.springframework.cache]": DEBUG
    "[feign]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}/%X{spanId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId} spanId=%X{spanId}] - %msg%n"

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Movie Service for LMDB platform
    version: 1.0.0
    java-version: ${java.version}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:configserver:http://localhost:8888

