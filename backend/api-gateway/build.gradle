plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Shared Library
    implementation project(':backend:shared-library')
    
    // Spring Cloud Gateway
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    
    // Circuit Breaker with Resilience4j
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    
    // Rate Limiting with Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    
    // Security and JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    
    // Actuator for health checks
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    runtimeOnly 'io.zipkin.reporter2:zipkin-reporter-brave'

    // Lombok for cleaner code
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    // Boot 4 modularized WebTestClient auto-configuration into its own module.
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'

    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // Gateway integration tests: WireMock stands in for downstream services
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

bootJar {
    archiveBaseName = 'api-gateway'
    archiveVersion = project.version
}

tasks.named('test') {
    dependsOn ':backend:movie-service:publishToMavenLocal'
    dependsOn ':backend:actor-service:publishToMavenLocal'
    dependsOn ':backend:user-service:publishToMavenLocal'
    dependsOn ':backend:ai-service:publishToMavenLocal'
}



