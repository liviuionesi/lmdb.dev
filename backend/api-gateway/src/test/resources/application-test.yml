server:
  port: 0  # Random port for testing

spring:
  application:
    name: api-gateway-test
  
  # Disable Redis-dependent features for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: test-route
              uri: http://localhost:8080
              predicates:
                - Path=/test/**
          discovery:
            locator:
              enabled: false  # Disable for unit tests

eureka:
  client:
    enabled: false  # Disable Eureka for unit tests
    register-with-eureka: false
    fetch-registry: false

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-jwt-token-validation-must-be-long-enough-for-tests
  expiration: 86400000

# Disable actuator endpoints in tests
management:
  endpoints:
    web:
      exposure:
        # Mirrors the production exposure list — a narrower one here would let
        # the suite pass while the scrape endpoint is unreachable in the
        # deployed service, which is the drift #23 exists to catch.
        include: health,info,metrics,prometheus,gateway

# Logging for tests
logging:
  level:
    root: INFO
    com.filmpire.gateway: DEBUG

