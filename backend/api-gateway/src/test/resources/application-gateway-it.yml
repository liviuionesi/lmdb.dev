# Test profile for GatewayIntegrationTest (#19, #33).
#
# Boots the REAL gateway but replaces the production `lb://service` routes
# (which resolve via Eureka) with static routes pointing at WireMock servers.
# Eureka and the discovery route locator are disabled; Redis host/port come from
# a Testcontainers container via @DynamicPropertySource.
#
# TWO WireMock servers, deliberately:
#   * 9971 stands in for movie-service AND (on the /3/** paths) the real TMDB;
#   * 9972 stands in for actor-service.
# Routing "to the correct downstream" is the whole point of several assertions,
# and a single shared server cannot prove it — every route would hit the same
# port, so a person request mis-routed to movie-service would still pass. The
# split port makes the destination observable.
#
# The predicates below MIRROR PRODUCTION EXACTLY. That matters most for the
# /search namespace: TMDB shares it across resource types, so production splits
# `/search/movie` (movie-service) from `/search/person` (actor-service) rather
# than using a blanket `/search/**`. A broad predicate here would silently pass
# while production mis-routed person searches.
#
# The route list here REPLACES the base application.yml routes (Spring Boot does
# not merge list properties across profile documents). More specific test-only
# paths (cbtest, rltest) are listed first so they win over the general
# movie-service route.

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false          # no Eureka-derived routes in tests
          # Drop the production default-filters: the Retry filter retries GET on
          # 503, which would multiply requests and corrupt circuit-breaker and
          # request-count assertions.
          default-filters: []
          routes:
            # --- Circuit-breaker test route (statusCodes makes 500 a CB failure) ---
            - id: cb-test
              uri: http://localhost:9971
              predicates:
                - Path=/api/v1/movies/cbtest/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: cbTestCircuitBreaker
                    fallbackUri: forward:/fallback/movies
                    statusCodes: 500

            # --- Rate-limit test route (tiny burst so it trips fast) ---
            - id: rl-test
              uri: http://localhost:9971
              predicates:
                - Path=/api/v1/movies/rltest/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    "[redis-rate-limiter.replenishRate]": 1
                    "[redis-rate-limiter.burstCapacity]": 3
                    "[redis-rate-limiter.requestedTokens]": 1

            # --- Movie service (public GET; also serves /api/v1/genres) ---
            - id: movie-service
              uri: http://localhost:9971
              predicates:
                - Path=/api/v1/movies/**,/api/v1/genres/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movieServiceCircuitBreaker
                    fallbackUri: forward:/fallback/movies

            # --- User service (protected by Spring Security) ---
            - id: user-service
              uri: http://localhost:9971
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/users

            # --- Actor service (public GET) → the actor WireMock on 9972 ---
            - id: actor-service
              uri: http://localhost:9972
              predicates:
                - Path=/api/v1/actors/**

            # --- TMDB v3 facade routes (#33) → WireMock stand-in downstreams.
            # Predicates mirror production; note /search is split by resource
            # type across the two routes below. ---
            - id: tmdb-movie-facade
              uri: http://localhost:9971
              predicates:
                - Path=/movie/**,/genre/**,/discover/**,/search/movie
              filters:
                - RemoveRequestParameter=api_key
            - id: tmdb-person-facade
              uri: http://localhost:9972
              predicates:
                - Path=/person/**,/search/person
              filters:
                - RemoveRequestParameter=api_key

            # --- TMDB auth/account proxy (#33) → WireMock stands in for real TMDB.
            # PrefixPath=/3 mirrors production; the client api_key is removed and the
            # server-side key injected. ---
            - id: tmdb-authentication-proxy
              uri: http://localhost:9971
              predicates:
                - Path=/authentication/**
              filters:
                - PrefixPath=/3
                - RemoveRequestParameter=api_key
                - AddRequestParameter=api_key,${tmdb.api.key}
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - id: tmdb-account-proxy
              uri: http://localhost:9971
              predicates:
                - Path=/account/**
              filters:
                - PrefixPath=/3
                - RemoveRequestParameter=api_key
                - AddRequestParameter=api_key,${tmdb.api.key}
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

  data:
    redis:
      # host/port injected by @DynamicPropertySource; the test Redis has no auth
      password:

# No Eureka in integration tests
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Tune the circuit breaker used by the cb-test route so it opens after only a
# few failing calls (production defaults would need far more traffic).
resilience4j:
  circuitbreaker:
    instances:
      cbTestCircuitBreaker:
        base-config: default
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 2s
        permitted-number-of-calls-in-half-open-state: 1

# Server-side TMDB key injected by the auth/account proxy routes (#33).
tmdb:
  api:
    key: server-side-key

# application.yml's JWT_SECRET fallback was stripped to empty (#114), so
# JwtUtil now needs a real value here — without it, boot fails with
# WeakKeyException before any route or filter test can even run.
jwt:
  secret: test-secret-key-for-jwt-token-validation-must-be-long-enough-for-tests
