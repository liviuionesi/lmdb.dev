# Caddy TLS-terminating reverse proxy for the AWS overlay (ADR-019).
#
# AWS's gateway Service is NodePort-only, plain HTTP (no Elastic LB — see
# modules/network-aws/main.tf), but the Vercel frontend is HTTPS and
# browsers block that mixed content. This pod bridges the gap without adding
# a billable AWS resource: it runs hostNetwork on the EC2 node's public IP
# and gets a real Let's Encrypt certificate for api.lmdb.dev
# automatically, then reverse-proxies to the gateway's ClusterIP Service.
#
# /data is a PVC so the issued cert survives pod restarts and cluster
# stop/start cycles instead of hitting Let's Encrypt's rate limit every time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  Caddyfile: |
    {
      email pehlivanu@gmail.com
    }

    api.lmdb.dev {
      reverse_proxy api-gateway.default.svc.cluster.local:8080
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-tls
  labels:
    app: caddy-tls
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy-tls
  template:
    metadata:
      labels:
        app: caddy-tls
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
