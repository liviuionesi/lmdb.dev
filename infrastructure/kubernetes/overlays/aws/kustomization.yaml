apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full local-parity service set (#151) — identical rationale to
# overlays/azure; the AWS target is a self-managed k3s node instead of AKS,
# bumped to m7i-flex.large (infrastructure/terraform/aws/variables.tf, the largest free-tier-eligible type this account allows) to fit the
# same additions Azure needed. media-service and the Discovery/Config/
# Kafka/Zipkin infra services stay out — see overlays/azure's comment for
# why.
resources:
  - ../../base/api-gateway
  - ../../base/movie-service
  - ../../base/actor-service
  - ../../base/user-service
  - ../../base/ai-service
  - ../../base/mongodb
  - ../../base/postgres
  - ../../base/redis
  - ../../base/ollama
  - caddy-tls.yaml

secretGenerator:
  - name: lmdb-secrets
    envs:
      - secrets.env

# See overlays/azure's identical block for the reasoning (no Eureka, no
# Kafka broker in this overlay; ai-service's MOVIE_SERVICE_BASE_URL needs
# rewriting off the Eureka-resolved lb:// scheme).
configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - CLOUD_PROVIDER=aws
  - name: movie-service-config
    behavior: merge
    literals:
      - SPRING_KAFKA_LISTENER_AUTO_STARTUP=false
  - name: actor-service-config
    behavior: merge
    literals:
      - EUREKA_CLIENT_ENABLED=false
  - name: user-service-config
    behavior: merge
    literals:
      - EUREKA_CLIENT_ENABLED=false
  - name: ai-service-config
    behavior: merge
    literals:
      - EUREKA_CLIENT_ENABLED=false
      - MOVIE_SERVICE_BASE_URL=http://movie-service:8081

images:
  - name: lmdb/api-gateway
    newName: ghcr.io/liviuionesi/lmdb-api-gateway
    newTag: latest # docker-publish.yml (#28) pushes both :latest and :${GIT_SHA}; deploy always rolls out :latest
  - name: lmdb/movie-service
    newName: ghcr.io/liviuionesi/lmdb-movie-service
    newTag: latest
  - name: lmdb/actor-service
    newName: ghcr.io/liviuionesi/lmdb-actor-service
    newTag: latest
  - name: lmdb/user-service
    newName: ghcr.io/liviuionesi/lmdb-user-service
    newTag: latest
  - name: lmdb/ai-service
    newName: ghcr.io/liviuionesi/lmdb-ai-service
    newTag: latest

patches:
  # The README documented this Service as already patched to NodePort 30080
  # (matching modules/network-aws's security-group rule) but the patch was
  # never actually written — found on #27's first live apply, where the
  # gateway was unreachable from outside the cluster despite every pod
  # being Ready. Traefik is disabled in the node's k3s install (see
  # modules/cluster-k3s), so the base Ingress resource has no controller to
  # serve it; NodePort is the only path in.
  - target:
      kind: Service
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # -Djava.net.preferIPv4Stack=true: found live on #26's Azure apply — an
  # overlay network whose DNS resolves external hosts to IPv6-only
  # addresses with no actual route hangs every outbound JVM call until the
  # gateway's circuit breaker times out. AWS's overlay hasn't shown this
  # symptom, but the flag is harmless, so it's set unconditionally here
  # too rather than waiting to find out the hard way.
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: movie-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: actor-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: ai-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: mongodb
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 30m
            memory: 32Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 200m
            memory: 96Mi
            ephemeral-storage: 128Mi
  - target:
      kind: StatefulSet
      name: ollama
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 150m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: "1"
            memory: 1536Mi
            ephemeral-storage: 512Mi
