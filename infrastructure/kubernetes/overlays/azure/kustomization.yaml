apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full local-parity service set (#151): gateway, movie/actor/user/ai-service +
# MongoDB/Postgres/Redis/Ollama — everything that runs locally except
# media-service (no k8s manifests exist for it yet) and the
# Discovery/Config/Kafka/Zipkin infra services, which ADR-005 deliberately
# never puts in any K8s overlay (K8s Services + cluster DNS take over
# Eureka/Config Server's role; Kafka/Zipkin are internal observability, not
# a user-facing feature). Needs Standard_D4ls_v7 (infrastructure/terraform/
# azure/variables.tf) — the smaller D2ls_v7 only fit the movie-only slice.
# Plus caddy-tls.yaml (ADR-019): TLS termination for the gateway's plain-HTTP
# NodePort, since this overlay has no LoadBalancer/ingress-nginx.
resources:
  - ../../base/api-gateway
  - ../../base/movie-service
  - ../../base/actor-service
  - ../../base/user-service
  - ../../base/ai-service
  - ../../base/mongodb
  - ../../base/postgres
  - ../../base/redis
  - ../../base/ollama
  - caddy-tls.yaml

secretGenerator:
  - name: lmdb-secrets
    envs:
      - secrets.env

# This overlay has no Eureka (discovery-service) — without EUREKA_CLIENT_ENABLED=false
# each service spins forever trying to register with/fetch from a server
# that doesn't exist here. movie-service/api-gateway already set this via
# their base ConfigMaps directly (base already assumes no Eureka for them);
# actor/user/ai-service's base ConfigMaps default to Eureka-on (correct for
# overlays/local, which does deploy it), so it's overridden here instead.
# ai-service's MOVIE_SERVICE_BASE_URL also gets rewritten off the
# Eureka-resolved lb:// scheme to plain cluster-DNS, same reasoning as the
# gateway's own "kubernetes" Spring profile (application.yml).
configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - CLOUD_PROVIDER=azure
  - name: movie-service-config
    behavior: merge
    literals:
      - SPRING_KAFKA_LISTENER_AUTO_STARTUP=false
  - name: actor-service-config
    behavior: merge
    literals:
      - EUREKA_CLIENT_ENABLED=false
  - name: user-service-config
    behavior: merge
    literals:
      - EUREKA_CLIENT_ENABLED=false
  - name: ai-service-config
    behavior: merge
    literals:
      - EUREKA_CLIENT_ENABLED=false
      - MOVIE_SERVICE_BASE_URL=http://movie-service:8081
      - ACTOR_SERVICE_BASE_URL=http://actor-service:8083

images:
  - name: lmdb/api-gateway
    newName: ghcr.io/liviuionesi/lmdb-api-gateway
    newTag: latest # docker-publish.yml (#28) pushes both :latest and :${GIT_SHA}; deploy always rolls out :latest
  - name: lmdb/movie-service
    newName: ghcr.io/liviuionesi/lmdb-movie-service
    newTag: latest
  - name: lmdb/actor-service
    newName: ghcr.io/liviuionesi/lmdb-actor-service
    newTag: latest
  - name: lmdb/user-service
    newName: ghcr.io/liviuionesi/lmdb-user-service
    newTag: latest
  - name: lmdb/ai-service
    newName: ghcr.io/liviuionesi/lmdb-ai-service
    newTag: latest

patches:
  # No Standard Load Balancer / NAT gateway for this overlay (issue #26
  # scope update — both bill hourly): the gateway is reached directly on
  # the node's public IP, so its Service has to be NodePort instead of the
  # base's ClusterIP. 30080 must match modules/network's
  # demo_inbound_port in infrastructure/terraform (that's the port opened
  # in the NSG) — see infrastructure/terraform/README.md step 4.
  - target:
      kind: Service
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # Free-tier node sizing (§11.1): -XX:MaxRAMPercentage=60 -Xss256k keeps the
  # JVM heap inside a small container memory limit instead of the Dockerfile
  # default fixed -Xmx512m, which would OOM-kill on a ~1GB node once
  # MongoDB/Redis/OS overhead are accounted for. Single replicas (base
  # already defaults to 1).
  #
  # -Djava.net.preferIPv4Stack=true: found live on #26's apply — this
  # AKS overlay network's DNS resolves external hosts (TMDB, even
  # google.com) to IPv6-only addresses that the overlay network has no
  # actual route for. Without this flag, the JVM tries the AAAA record
  # first and every outbound call (movie-service -> TMDB) hangs until the
  # gateway's circuit breaker times out. Harmless everywhere else, so set
  # unconditionally rather than only where the symptom was seen.
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-XX:MaxRAMPercentage=60 -Xss256k -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 224Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: movie-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-XX:MaxRAMPercentage=60 -Xss256k -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          # 300Mi OOM-killed this container every ~40min in live use (#151) -
          # movie-service's real footprint (MongoDB driver pool, WebClient,
          # Jackson, Kafka client buffers even with the listener disabled
          # below) doesn't fit a -XX:MaxRAMPercentage=60 heap that tight.
          requests:
            cpu: 100m
            memory: 224Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # actor/user/ai-service: base's fixed -Xms256m -Xmx512m JAVA_OPTS is kept
  # as-is (already reasonable against their 768Mi limit) - just append the
  # same IPv4-preference flag as api-gateway/movie-service (actor-service
  # calls real TMDB for the person facade the same way movie-service does)
  # and force fresh image pulls, same reasoning as above.
  - target:
      kind: Deployment
      name: actor-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: ai-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: mongodb
    patch: |-
      # 300m/384Mi was too tight even in steady state, not just during
      # first-boot init -- same root cause as the AWS overlay's identical
      # bug (#27's live-run findings) plus a new one found live (#151): the
      # 384Mi limit itself OOM-killed (exit 137) mid first-boot init, before
      # the root user got created, leaving auth enabled with no valid user -
      # a stuck state that needed a PVC wipe + clean re-init to recover
      # from, not just a restart. Standard_D4ls_v7 has 4 full vCPUs and
      # ~7.7Gi allocatable; MongoDB gets a real share of both now.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 768Mi
            ephemeral-storage: 256Mi
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 32Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 200m
            memory: 96Mi
            ephemeral-storage: 128Mi
