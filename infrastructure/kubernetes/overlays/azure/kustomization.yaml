apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core slice only (ARCHITECTURE.md §11.1): gateway, movie-service + MongoDB +
# Redis. Discovery and Config are never part of any K8s overlay (ADR-005);
# user-service/actor-service/Postgres are dropped here specifically because a
# free-tier 1-2GB node can't fit the full 8-service stack — they still run in
# the local overlay and the docker-compose profile.
resources:
  - ../../base/api-gateway
  - ../../base/movie-service
  - ../../base/mongodb
  - ../../base/redis

secretGenerator:
  - name: filmpire-secrets
    envs:
      - secrets.env

# This overlay has no Kafka broker (unlike overlays/local) - without this,
# movie-service's analytics @KafkaListener spins forever trying to reach
# localhost:9092, wasting CPU/threads on a broker that will never exist
# here (#151, found live: contributed to the OOM below).
configMapGenerator:
  - name: movie-service-config
    behavior: merge
    literals:
      - SPRING_KAFKA_LISTENER_AUTO_STARTUP=false

images:
  - name: filmpire/api-gateway
    newName: ghcr.io/pehlivanu/filmpire-api-gateway
    newTag: latest # docker-publish.yml (#28) pushes both :latest and :${GIT_SHA}; deploy always rolls out :latest
  - name: filmpire/movie-service
    newName: ghcr.io/pehlivanu/filmpire-movie-service
    newTag: latest

patches:
  # No Standard Load Balancer / NAT gateway for this overlay (issue #26
  # scope update — both bill hourly): the gateway is reached directly on
  # the node's public IP, so its Service has to be NodePort instead of the
  # base's ClusterIP. 30080 must match modules/network's
  # demo_inbound_port in infrastructure/terraform (that's the port opened
  # in the NSG) — see infrastructure/terraform/README.md step 4.
  - target:
      kind: Service
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # Free-tier node sizing (§11.1): -XX:MaxRAMPercentage=60 -Xss256k keeps the
  # JVM heap inside a small container memory limit instead of the Dockerfile
  # default fixed -Xmx512m, which would OOM-kill on a ~1GB node once
  # MongoDB/Redis/OS overhead are accounted for. Single replicas (base
  # already defaults to 1).
  #
  # -Djava.net.preferIPv4Stack=true: found live on #26's apply — this
  # AKS overlay network's DNS resolves external hosts (TMDB, even
  # google.com) to IPv6-only addresses that the overlay network has no
  # actual route for. Without this flag, the JVM tries the AAAA record
  # first and every outbound call (movie-service -> TMDB) hangs until the
  # gateway's circuit breaker times out. Harmless everywhere else, so set
  # unconditionally rather than only where the symptom was seen.
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-XX:MaxRAMPercentage=60 -Xss256k -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 224Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: movie-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-XX:MaxRAMPercentage=60 -Xss256k -Djava.net.preferIPv4Stack=true"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          # 300Mi OOM-killed this container every ~40min in live use (#151) -
          # movie-service's real footprint (MongoDB driver pool, WebClient,
          # Jackson, Kafka client buffers even with the listener disabled
          # below) doesn't fit a -XX:MaxRAMPercentage=60 heap that tight.
          # Node (Standard_D2ls_v7, ~2.85Gi allocatable) has ample headroom.
          requests:
            cpu: 100m
            memory: 224Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: mongodb
    patch: |-
      # 300m was too tight even in steady state, not just during first-boot
      # init -- same root cause as the AWS overlay's identical bug (#27's
      # live-run findings): simple queries stall under CPU starvation, and
      # a slow first-boot createUser can get killed by a probe before it
      # commits. Standard_D2ls_v7 has 2 full vCPUs; MongoDB gets a real share.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 800m
            memory: 384Mi
            ephemeral-storage: 256Mi
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 32Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 200m
            memory: 96Mi
            ephemeral-storage: 128Mi
