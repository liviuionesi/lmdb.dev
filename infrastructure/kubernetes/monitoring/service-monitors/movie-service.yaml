# ServiceMonitor for movie-service (issue #24, ARCHITECTURE.md section 12.1).
# See README.md for the labeling contract this depends on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: movie-service-monitor
  namespace: monitoring
  labels:
    app: movie-service
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: movie-service
      monitoring: enabled
  endpoints:
    - targetPort: 8081
      path: /actuator/prometheus
      interval: 10s
