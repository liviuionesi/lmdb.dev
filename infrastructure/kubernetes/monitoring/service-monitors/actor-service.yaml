# ServiceMonitor for actor-service (issue #24, ARCHITECTURE.md section 12.1).
# See README.md for the labeling contract this depends on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: actor-service-monitor
  namespace: monitoring
  labels:
    app: actor-service
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: actor-service
      monitoring: enabled
  endpoints:
    - targetPort: 8083
      path: /actuator/prometheus
      interval: 10s
