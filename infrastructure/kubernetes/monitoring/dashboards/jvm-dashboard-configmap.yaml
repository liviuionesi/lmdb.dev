# Grafana dashboard ConfigMap (issue #24, ARCHITECTURE.md section 12.1).
# Picked up automatically by the Grafana sidecar configured in
# ../values.yaml (grafana.sidecar.dashboards, label grafana_dashboard=1) —
# `kubectl apply -f .` in this directory is enough to publish it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filmpire-jvm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  jvm-dashboard.json: |
    {
      "title": "LMDB - JVM",
      "uid": "filmpire-jvm",
      "tags": ["filmpire"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "application",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "$datasource" },
            "query": "label_values(jvm_memory_used_bytes, application)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Heap usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{area=\"heap\", application=~\"$application\"}) by (application) / sum(jvm_memory_max_bytes{area=\"heap\", application=~\"$application\"}) by (application)",
              "legendFormat": "{{application}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Heap used vs. max (bytes)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{area=\"heap\", application=~\"$application\"}) by (application)",
              "legendFormat": "{{application}} used"
            },
            {
              "expr": "sum(jvm_memory_max_bytes{area=\"heap\", application=~\"$application\"}) by (application)",
              "legendFormat": "{{application}} max"
            }
          ]
        },
        {
          "id": 3,
          "title": "GC pause rate (s/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(jvm_gc_pause_seconds_sum{application=~\"$application\"}[5m])) by (application, action)",
              "legendFormat": "{{application}} {{action}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Live threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{application=~\"$application\"}",
              "legendFormat": "{{application}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Process CPU usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "process_cpu_usage{application=~\"$application\"}",
              "legendFormat": "{{application}}"
            }
          ]
        }
      ]
    }
