# Grafana dashboard ConfigMap (issue #24, ARCHITECTURE.md section 12.1).
# Picked up automatically by the Grafana sidecar configured in
# ../values.yaml (grafana.sidecar.dashboards, label grafana_dashboard=1) —
# `kubectl apply -f .` in this directory is enough to publish it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmdb-http-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  http-dashboard.json: |
    {
      "title": "LMDB - HTTP",
      "uid": "lmdb-http",
      "tags": ["lmdb"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "application",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "$datasource" },
            "query": "label_values(http_server_requests_seconds_count, application)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request rate by endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{application=~\"$application\"}[5m])) by (application, uri)",
              "legendFormat": "{{application}} {{uri}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx) by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{application=~\"$application\", status=~\"5..\"}[5m])) by (application)",
              "legendFormat": "{{application}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "P95 request duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=~\"$application\"}[5m])) by (le, application))",
              "legendFormat": "{{application}} p95"
            }
          ]
        },
        {
          "id": 4,
          "title": "P50 / P99 request duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{application=~\"$application\"}[5m])) by (le, application))",
              "legendFormat": "{{application}} p50"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=~\"$application\"}[5m])) by (le, application))",
              "legendFormat": "{{application}} p99"
            }
          ]
        }
      ]
    }
