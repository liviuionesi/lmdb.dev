apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: ai-service-config
    literals:
      - SPRING_APPLICATION_NAME=ai-service
      - SPRING_PROFILES_ACTIVE=prod
      # ai-service owns its own database (ADR-002/ADR-012) — lmdb_ai,
      # created by postgres/init-multiple-databases.sh on first boot. The
      # shared postgres StatefulSet must run pgvector/pgvector:pg17.
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/lmdb_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - MOVIE_SERVICE_BASE_URL=lb://movie-service
