apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ai-service
          image: lmdb/ai-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 9084
              name: grpc
          envFrom:
            - configMapRef:
                name: ai-service-config
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 50
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Memory bumped from 384Mi/768Mi for #212 (bilingual Vosk speech-to-text,
          # ADR-021): a second resident model (English's own model also grew, small ->
          # lgraph) adds real off-heap footprint alongside JAVA_OPTS' -Xmx512m heap.
          # This is a conservative, unmeasured buffer, not a measured value — this
          # environment has no network egress to the Vosk model host to actually
          # load both models and check combined RSS (same constraint ADR-021
          # documents). Revisit with real numbers once that's possible.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1024Mi
              ephemeral-storage: 512Mi
