apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  # Default RollingUpdate (25% surge, rounded up to 1 for a single replica)
  # starts the new pod BEFORE killing the old one, briefly doubling JVM
  # memory/CPU demand. On the free-tier demo nodes (#26/#27) that doubling
  # was enough to OOM-thrash the whole node during a routine secret
  # rotation — found live on #27's apply. A brief unavailability window is
  # the correct trade here, not a surge.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api-gateway
          image: filmpire/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filmpire-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: filmpire-secrets
                  key: JWT_SECRET
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: filmpire-secrets
                  key: TMDB_API_KEY
          # Reactive Spring Boot's cold start can exceed the old fixed
          # initialDelaySeconds under a demo node's tight CPU limit (found
          # live on #27's k3s apply — see infrastructure/terraform/README.md),
          # killing the container mid-boot. A startupProbe absorbs that
          # variance: liveness/readiness only start counting once this
          # succeeds, so steady-state failure detection stays fast.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 512Mi
