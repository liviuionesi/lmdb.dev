apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    # Required by monitoring/service-monitors/api-gateway.yaml's selector —
    # see that directory's README for the labeling contract.
    monitoring: enabled
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
