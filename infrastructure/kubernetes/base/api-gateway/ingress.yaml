apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  # No `host` filter: matches any Host header, so the same manifest works
  # against a minikube IP, a cloud node's public IP, or a real domain later
  # without an /etc/hosts edit or per-overlay patch.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
