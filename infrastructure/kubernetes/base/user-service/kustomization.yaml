apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: user-service-config
    literals:
      # Config Server is not deployed to Kubernetes (ADR-005) — ConfigMaps
      # and Secrets carry these values instead. Off explicitly so the pod
      # never reaches for a config server that isn't there.
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_APPLICATION_NAME=user-service
      - SPRING_PROFILES_ACTIVE=prod
      # user-service owns the default POSTGRES_DB (lmdb) — ADR-002.
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/lmdb
