apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
  labels:
    app: movie-service
spec:
  replicas: 1
  # See api-gateway/deployment.yaml's identical strategy for why: default
  # RollingUpdate surges a second JVM instance before killing the first,
  # which OOM-thrashed the free-tier demo node during a routine secret
  # rotation (#27's live apply). maxSurge:0 trades a brief unavailability
  # window for never running two instances at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: movie-service
          image: lmdb/movie-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: movie-service-config
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: MONGODB_URI
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: REDIS_PASSWORD
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: TMDB_API_KEY
          # Same issue as api-gateway's identical fix: a fixed-delay
          # liveness probe killed this container mid-boot under a free-tier
          # node's CPU limit (found live on #26's Azure apply, same root
          # cause already documented on AWS's #27). startupProbe absorbs
          # first-boot variance; liveness/readiness only start counting
          # once it succeeds.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 512Mi
