apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: actor-service-config
    literals:
      # Config Server is not deployed to Kubernetes (ADR-005) — ConfigMaps
      # and Secrets carry these values instead. Off explicitly so the pod
      # never reaches for a config server that isn't there.
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_APPLICATION_NAME=actor-service
      - SPRING_PROFILES_ACTIVE=prod
      # actor-service owns its own database (ADR-002) — lmdb_actor,
      # created by postgres/init-multiple-databases.sh on first boot.
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/lmdb_actor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
