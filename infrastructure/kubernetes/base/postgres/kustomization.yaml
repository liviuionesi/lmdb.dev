apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: postgres-config
    literals:
      # ADR-002 (database-per-service): the default POSTGRES_DB is
      # user-service's database; actor-service and ai-service (ADR-012) get
      # their own (lmdb_actor, lmdb_ai), created by
      # init-multiple-databases.sh on first boot — mirrors
      # infrastructure/docker/docker-compose.yml exactly.
      - POSTGRES_DB=filmpire
      - POSTGRES_MULTIPLE_DATABASES=lmdb_actor,lmdb_ai
  - name: postgres-init
    files:
      - init-multiple-databases.sh

generatorOptions:
  disableNameSuffixHash: false
