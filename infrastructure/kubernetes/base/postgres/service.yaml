apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  # Headless: StatefulSet convention, and user-service/actor-service connect
  # by Service DNS name (postgres:5432) regardless — a single replica makes
  # this equivalent in practice to a ClusterIP Service.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
