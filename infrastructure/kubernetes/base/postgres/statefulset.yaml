apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # No pod in this stack talks to the Kubernetes API — never mount a
      # token they don't need.
      automountServiceAccountToken: false
      containers:
        - name: postgres
          # pgvector, not stock postgres (#36, ADR-012) — ai-service needs the
          # vector extension. See infrastructure/docker/docker-compose.yml.
          image: docker.io/pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: postgres-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lmdb-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # subPath keeps PGDATA in a subdirectory of the PVC so a CSI
            # driver that seeds the volume root with lost+found (some do)
            # never makes initdb see a non-empty data directory.
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Runs only on first init (empty PGDATA) — same convention as the
          # docker-compose profile's /docker-entrypoint-initdb.d scripts.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
