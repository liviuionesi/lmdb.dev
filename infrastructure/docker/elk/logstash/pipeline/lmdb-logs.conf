# Filmpire log pipeline (issue #24, ARCHITECTURE.md section 12.2).
#
# Filebeat's container input already strips the podman/k8s-file log-runtime
# envelope, so `message` here is exactly one line of application stdout —
# and every service emits one JSON object per line via logstash-logback-
# encoder (#23, config/logging/logback-spring.xml). Nothing to grok.

input {
  beats {
    port => 5044
  }
}

filter {
  # 1. Parse the application's JSON log line into top-level fields. No
  #    `target` is given, so the parsed keys (@timestamp, application,
  #    level, message, traceId, spanId, ...) merge into event root and
  #    naturally overwrite the raw JSON string that was in `message`.
  json {
    source => "message"
  }

  # 2. Drop Beats/container envelope fields the app's own JSON already
  #    makes redundant (agent metadata, ECS version marker, the source
  #    file path, ...). Keeps the index mapping to what we actually query.
  mutate {
    # `event.original` is Filebeat/ECS's copy of the exact same raw JSON
    # string step 1 just parsed — keeping it duplicates every field on
    # every line, doubling index storage for nothing (same failure mode
    # #23 fixed for the appName/application duplicate).
    remove_field => ["agent", "ecs", "input", "log", "tags", "@version", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Date math in the index name buckets by the EVENT's own @timestamp
    # (the app's log time, set in step 1 above), not ingestion time.
    index => "filmpire-logs-%{+YYYY.MM.dd}"
    # The setup service (infrastructure/docker/elk/setup/) already PUTs the
    # index template carrying index.lifecycle.name — Logstash must not
    # overwrite it with its own default template.
    manage_template => false
  }
}
