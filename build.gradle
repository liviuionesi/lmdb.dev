plugins {
    id 'java'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management' apply false
    // OpenRewrite drives automated framework migrations (e.g. Spring Boot
    // version upgrades) as reviewable, idempotent source transformations.
    // Run `./gradlew rewriteDryRun` to preview, `./gradlew rewriteRun` to apply.
    id 'org.openrewrite.rewrite' version "${openRewriteVersion}"
    // SonarQube static analysis (#20). Applied at the root of the multi-module
    // build; it discovers every subproject and each module's JaCoCo XML report.
    // Run:  ./gradlew test jacocoTestReport sonar
    id 'org.sonarqube' version "${sonarqubePluginVersion}"
    // Formatting gate (#101) — applied per-subproject below. Declared here
    // (apply false) so every module resolves the same plugin version.
    id 'com.diffplug.spotless' version "${spotlessVersion}" apply false
    // Dependency/security-scan gate (#101). Aggregate mode: one report
    // across every subproject's resolved dependencies, not per-module.
    // Run:  ./gradlew dependencyCheckAggregate
    id 'org.owasp.dependencycheck' version "${owaspDependencyCheckVersion}"
}

allprojects {
    group = 'dev.lmdb'
    version = projectVersion
}

// OpenRewrite recipe wiring. Recipe artifacts resolve from the settings-level
// repositories (settings.gradle enforces FAIL_ON_PROJECT_REPOS, so no
// project-scoped repositories block is used here). The rewrite-recipe-bom pins
// a mutually-compatible set of recipe module versions.
dependencies {
    rewrite platform("org.openrewrite.recipe:rewrite-recipe-bom:${rewriteRecipeBomVersion}")
    rewrite 'org.openrewrite.recipe:rewrite-spring'
}

rewrite {
    // Full Spring Boot 3.5 -> 4.0 migration: bumps Boot/Cloud/Framework/Security,
    // renames deprecated starters, and rewrites deprecated/renamed APIs and
    // configuration properties. See ADR-009.
    activeRecipe('org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0')
    activeRecipe('org.openrewrite.gradle.ChangeTaskToTasksRegister')
    activeRecipe('org.openrewrite.gradle.security.UseHttpsForRepositories')
    activeRecipe('org.openrewrite.gradle.RemoveRedundantDependencyVersions')
}

// SonarQube analysis configuration (#20). Host/token come from the environment
// so credentials never live in the repo:
//   SONAR_HOST_URL  (default http://localhost:9010 — the compose host port,
//                    since MinIO already binds 9000)
//   SONAR_TOKEN     (a user token minted in SonarQube; required to publish)
// The plugin picks up each module's JaCoCo XML report automatically; the
// explicit path pattern below is belt-and-braces. Run:
//   docker compose --profile sonar up -d
//   ./gradlew test jacocoTestReport sonar
sonar {
    properties {
        property 'sonar.projectKey', 'lmdb-microservices'
        property 'sonar.projectName', 'LMDB Microservices'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://localhost:9010'
        if (System.getenv('SONAR_TOKEN')) {
            property 'sonar.token', System.getenv('SONAR_TOKEN')
        }
        // SonarCloud requires an organization key (self-hosted ignores it).
        // CI sets this from a secret; local runs against self-hosted don't
        // need it (#108).
        if (System.getenv('SONAR_ORGANIZATION')) {
            property 'sonar.organization', System.getenv('SONAR_ORGANIZATION')
        }

        // Aggregate JaCoCo coverage across every module.
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${rootDir}/backend/**/build/reports/jacoco/test/jacocoTestReport.xml"

        // Never analyze generated or build output. MapStruct *Impl classes are
        // generated; the descoped frontend placeholders carry no analyzable code.
        property 'sonar.exclusions',
                '**/generated/**,**/build/**,**/bin/**,**/*MapperImpl.java,frontend/**'

        // Coverage exclusions — keep the coverage % about real logic. These are
        // ANALYZED for bugs/smells (they stay out of sonar.exclusions), but not
        // counted against coverage: Spring Boot main classes (one bootstrap
        // line), @Configuration wiring, and OpenAPI/Swagger config have no
        // branch logic worth a unit test.
        property 'sonar.coverage.exclusions',
                '**/*Application.java,**/config/**,**/dto/**,**/*Config.java'

        // Test-file rule relaxations — the same three the prior SonarLint setup
        // used, now the single source of truth (the old sonar-project.properties
        // files are removed):
        //   S100  method naming — test methods use descriptive underscores
        //   S3305 field injection — @Autowired on fields is standard in Spring tests
        //   S1192 string-literal duplication — readability beats DRY in tests
        property 'sonar.issue.ignore.multicriteria', 'e1,e2,e3,e4'
        property 'sonar.issue.ignore.multicriteria.e1.ruleKey', 'java:S100'
        property 'sonar.issue.ignore.multicriteria.e1.resourceKey', '**/src/test/**/*'
        property 'sonar.issue.ignore.multicriteria.e2.ruleKey', 'java:S3305'
        property 'sonar.issue.ignore.multicriteria.e2.resourceKey', '**/src/test/**/*'
        property 'sonar.issue.ignore.multicriteria.e3.ruleKey', 'java:S1192'
        property 'sonar.issue.ignore.multicriteria.e3.resourceKey', '**/src/test/**/*'

        // e4: local-dev-only default Redis password in application.yml,
        // matching the value docker-compose.yml uses for its local
        // container. Real deployments must override via env var
        // (REDIS_PASSWORD is ${VAR:default}-overridable); not a production
        // secret. The equivalent mongo default used to trigger this rule
        // too but was removed instead of suppressed — see #106.
        property 'sonar.issue.ignore.multicriteria.e4.ruleKey', 'secrets:S6694'
        property 'sonar.issue.ignore.multicriteria.e4.resourceKey', '**/src/main/resources/application*.yml'
    }
}

// OWASP Dependency-Check (#101) — scans every subproject's resolved
// dependencies for known CVEs (NVD database). Optional NVD_API_KEY env var
// raises the NVD download rate limit; without it the first run is slower
// but still works. failBuildOnCVSS tightened from critical-only (9.0) to
// high+ (7.0) once the pre-existing high-severity backlog was triaged (#105).
// Run: ./gradlew dependencyCheckAggregate
dependencyCheck {
    failBuildOnCVSS = 7.0
    // HTML only — that's the one CI actually uploads as an artifact.
    formats = ['HTML']
    // Fixed, predictable path so CI can cache the NVD database across runs
    // instead of re-downloading it every time (it's several hundred MB).
    data {
        directory = "${rootDir}/.dependency-check-data"
    }
    nvd {
        if (System.getenv('NVD_API_KEY')) {
            apiKey = System.getenv('NVD_API_KEY')
        }
    }
    suppressionFile = "${rootDir}/dependency-check-suppressions.xml"
    analyzers {
        assemblyEnabled = false
        nodeAuditEnabled = false
        nodeEnabled = false
        // frontend/filmpire is scanned separately via `npm audit` in CI —
        // this plugin only needs to cover the Gradle/Java dependency graph.
    }
    // The root `rewrite` configuration (OpenRewrite recipe artifacts, incl.
    // an embedded Kotlin compiler) is build-tooling only — nothing in it
    // ships in any deployed service artifact, so CVEs against it are noise
    // for this gate rather than real findings (#105).
    skipConfigurations.add('rewrite')
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.property('javaVersion').toString()))
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(project.property('javaVersion').toString())
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Test) {
        useJUnitPlatform()

        // Explicit: a Gradle 9.6.1 upgrade silently stopped emitting these by
        // default, which broke both local diagnosis (build/test-results/test/
        // was binary-only, no XML/HTML) and backend-ci.yml's artifact upload
        // step (`backend/*/build/test-results/test/**/*.xml`), which would
        // have started uploading nothing without anyone noticing.
        reports {
            junitXml.required = true
            html.required = true
        }

        // Clean, readable test output
        testLogging {
            // Only show failures and skipped tests by default (less noise)
            // Use --info flag to see all tests: ./gradlew test --info
            events = ['failed', 'skipped']
            exceptionFormat = 'full'
            showStandardStreams = false
            showCauses = true
            showStackTraces = true
            
            // Show test class progress
            info {
                events = ['started', 'passed', 'skipped', 'failed']
                exceptionFormat = 'full'
            }
            
        addTestListener(new TestListener() {
            void beforeSuite(TestDescriptor suite) {}
            void afterSuite(TestDescriptor desc, TestResult result) {
                if (!desc.parent) {
                    def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                    def startItem = '|  ', endItem = '  |'
                    def repeatLength = startItem.length() + output.length() + endItem.length()
                    println('\n' + ('=' * repeatLength))
                    println(startItem + output + endItem)
                    println('=' * repeatLength)
                }
            }
            void beforeTest(TestDescriptor testDescriptor) {}
            void afterTest(TestDescriptor testDescriptor, TestResult result) {}
        })
        }
    }
    
    // Managed-dependency CVE fixes ahead of Spring Boot's next BOM refresh
    // (#105) — resolved against the imported BOM's own version properties,
    // the standard Spring Boot override mechanism.
    ext['tomcat.version'] = "${tomcatVersion}"
    ext['netty.version'] = "${nettyVersion}"
    ext['jackson-2-bom.version'] = "${jacksonBomVersion}"
    ext['postgresql.version'] = "${postgresqlDriverVersion}"
    ext['log4j2.version'] = "${log4j2Version}"
    ext['httpcore5.version'] = "${httpcore5Version}"

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
        }
    }

    // Not Spring-Boot-managed, so plain resolutionStrategy.force instead of
    // an ext[] BOM property override (#105).
    configurations.all {
        resolutionStrategy {
            // Pulled in by the Eureka client's netflix-infix across every
            // service that registers with discovery.
            force "org.apache.httpcomponents:httpclient:${httpclientVersion}"
            // Pulled in transitively by the MinIO client in media-service.
            force "org.apache.commons:commons-compress:${commonsCompressVersion}"
        }
    }

    // JaCoco configuration for test coverage
    jacoco {
        toolVersion = "${jacocoVersion}"
    }
    
    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    test {
        finalizedBy jacocoTestReport
    }

    // Coverage-verification exclusions (#108) — same rationale as
    // sonar.coverage.exclusions above: bootstrap classes, @Configuration
    // wiring, and DTOs have no branch logic worth gating on. An ext
    // property, not a local var, so a module's own build.gradle can extend
    // it (e.g. backend/ai-service/build.gradle adds protoc-generated
    // classes) before this closure resolves classDirectories at task-
    // execution time.
    ext.jacocoCoverageExclusions = [
            '**/*Application.class',
            '**/config/**',
            '**/dto/**',
            '**/*Config.class',
    ]

    // media-service (#94) is an unstarted Story's placeholder — one
    // Hello-World controller, no real feature code yet. Gating it on the
    // coverage threshold now would force either throwaway tests for
    // soon-to-be-replaced code or a premature implementation just to
    // satisfy this task. Deliberately, narrowly excluded until #94 lands —
    // every other backend module is enforced below.
    if (project.name != 'media-service') {
        jacocoTestCoverageVerification {
            dependsOn test
            classDirectories.setFrom(files {
                sourceSets.main.output.classesDirs.collect { dir ->
                    fileTree(dir: dir, excludes: project.jacocoCoverageExclusions)
                }
            })
            violationRules {
                rule {
                    limit {
                        // 80% minimum line coverage (#108) — the
                        // enterprise-level target set in issue #108's
                        // acceptance criteria.
                        minimum = 0.80
                    }
                }
            }
        }
    }

    // Common test dependencies
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Observability instrumentation (#23) — applied to every DEPLOYABLE service,
    // identified by the Spring Boot plugin rather than a hand-maintained module
    // list. That distinction matters: shared-library is a plain jar with no
    // actuator to expose and no stdout of its own, while a service added later
    // gets metrics and the shared JSON log format automatically instead of
    // silently shipping un-instrumented. Keying off the plugin (rather than
    // subprojects.findAll) also avoids depending on subproject evaluation order.
    plugins.withId('org.springframework.boot') {
        dependencies {
            // Registry only — the actuator starter each service already declares
            // exposes /actuator/prometheus once a registry is on the classpath.
            // runtimeOnly because nothing compiles against it.
            runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
            implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"
            // Distributed Tracing (ADR-007, Task #42) — Micrometer Tracing + Zipkin
            implementation 'io.micrometer:micrometer-tracing-bridge-brave'
            implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
        }


        // Ship the one shared logback-spring.xml inside every service jar instead
        // of duplicating it per module, so the log schema cannot drift between
        // services. Boot picks it up from the classpath root by name.
        //
        // It lives under backend/ deliberately: each service's Dockerfile copies
        // only gradlew, gradle/, the three root build files and backend/, so a
        // path outside backend/ simply does not exist inside the image. That bit
        // once already — the file sat at config/logging/, Gradle's from() treated
        // the missing directory as an empty copy, the image built green, and every
        // service shipped with the config silently absent.
        def sharedLogback = file("$rootDir/backend/observability/logback-spring.xml")
        tasks.named('processResources') {
            // Fail loudly rather than repeat that silent no-op.
            doFirst {
                if (!sharedLogback.exists()) {
                    throw new GradleException(
                        "Shared logging config missing at ${sharedLogback}. Every service " +
                        "would start with default logging and no JSON output (#23).")
                }
            }
            from(sharedLogback)
        }
    }
}

// ---------------------------------------------------------------------------
// Infrastructure & Cloud Deployment Tasks (group: 'deployment')
// ---------------------------------------------------------------------------
tasks.register('deployAzure', Exec) {
    group = 'deployment'
    description = 'Provisions Azure AKS infrastructure with Terraform and rolls out all microservices'
    commandLine './infrastructure/scripts/deploy-azure.sh'
}

tasks.register('destroyAzure', Exec) {
    group = 'deployment'
    description = 'Destroys Azure AKS infrastructure via Terraform to maintain $0 spend'
    commandLine './infrastructure/scripts/destroy-azure.sh'
}

tasks.register('deployAws', Exec) {
    group = 'deployment'
    description = 'Provisions AWS EC2 k3s infrastructure with Terraform and rolls out microservices'
    commandLine './infrastructure/scripts/deploy-aws.sh'
}

tasks.register('destroyAws', Exec) {
    group = 'deployment'
    description = 'Destroys AWS EC2 k3s infrastructure via Terraform to maintain $0 spend'
    commandLine './infrastructure/scripts/destroy-aws.sh'
}

tasks.register('startTunnel', Exec) {
    group = 'deployment'
    description = 'Starts a secure public Cloudflare HTTPS tunnel for the active API gateway'
    commandLine './infrastructure/scripts/start-tunnel.sh'
}

tasks.register('stopTunnel', Exec) {
    group = 'deployment'
    description = 'Stops the local Cloudflare tunnel container'
    commandLine './infrastructure/scripts/stop-tunnel.sh'
}

tasks.register('deployLocal', Exec) {
    group = 'deployment'
    description = 'Starts local microservices infrastructure and databases via Docker/Podman Compose'
    commandLine './infrastructure/scripts/start-infrastructure.sh'
}

tasks.register('stopLocal', Exec) {
    group = 'deployment'
    description = 'Stops all local microservices infrastructure and containers'
    commandLine './infrastructure/scripts/stop-infrastructure.sh'
}

tasks.register('startAzure', Exec) {
    group = 'deployment'
    description = 'Starts stopped Azure AKS cluster compute nodes'
    commandLine './infrastructure/scripts/start-azure.sh'
}

tasks.register('stopAzure', Exec) {
    group = 'deployment'
    description = 'Stops active Azure AKS cluster compute nodes to reduce compute cost to $0'
    commandLine './infrastructure/scripts/stop-azure.sh'
}

tasks.register('startAws', Exec) {
    group = 'deployment'
    description = 'Starts stopped AWS EC2 k3s instance'
    commandLine './infrastructure/scripts/start-aws.sh'
}

tasks.register('stopAws', Exec) {
    group = 'deployment'
    description = 'Stops active AWS EC2 k3s instance to reduce compute cost to $0'
    commandLine './infrastructure/scripts/stop-aws.sh'
}

tasks.register('stopAllClouds', Exec) {
    group = 'deployment'
    description = 'Detects and stops all running cloud backends (Azure, AWS, Minikube) to minimize idle spend'
    commandLine './infrastructure/scripts/stop-all-clouds.sh'
}

tasks.register('autoStopWatchdog', Exec) {
    group = 'deployment'
    description = 'Checks 1-hour backend activity and shuts down cloud compute if idle'
    commandLine './infrastructure/scripts/auto-stop-watchdog.sh'
}

tasks.register('statusInfra', Exec) {
    group = 'deployment'
    description = 'Checks the health and status of local, tunnel, and cloud infrastructure'
    commandLine './infrastructure/scripts/status-infra.sh'
}

tasks.register('projectStats', Exec) {
    group = 'documentation'
    description = 'Dynamically analyzes and generates project metrics & analytics report in docs/reports/PROJECT_METRICS.md'
    commandLine './infrastructure/scripts/generate-project-stats.sh'
}

// Automatically clear the STS workspace cache on clean builds to avoid stale IDE warnings
def cleanStsCacheTask = tasks.register('cleanStsCache', Delete) {
    group = 'build setup'
    description = 'Deletes the STS Language Server cache directory'
    delete "${System.getProperty('user.home')}/.sts4"
}

tasks.named('clean') {
    dependsOn cleanStsCacheTask
}
